# CI for the factory repo (card M1-03, CHK-M1-03-a).
name: CI

on:
  push:
    branches: [main, 'm*-integration']
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        description: Run the full verification matrix
        required: false
        type: boolean
        default: false
      mutate:
        description: Comma-separated list of files to mutate
        required: false
        type: string

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.verify == 'true' }}
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so check-scope can diff against origin/main
          fetch-depth: 0

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Scope check (diff against PR base branch, PR only)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-scope.mjs --base "origin/$BASE_REF"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Built CLI smoke test
        shell: bash
        run: |
          state_dir=$(mktemp -d)
          trap 'rm -rf "$state_dir"' EXIT
          status=0
          node lib/factory.mjs status --state-dir "$state_dir" --json 2>"$state_dir/stderr" || status=$?
          test "$status" -eq 1 && test -s "$state_dir/stderr"

      - name: Forbidden import scan
        run: node scripts/check-forbidden-imports.mjs

      - name: Traceability check
        run: node scripts/check-traceability.mjs --all --require-passing ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/m') && endsWith(github.ref, '-integration') && '--present-only' || '' }}

      - name: Manifest check
        run: node scripts/check-manifest.mjs

      - name: Evidence check
        shell: bash
        run: node scripts/check-evidence.mjs .factory/evidence/*/*.json

  mutation:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.verify != 'true' || github.event.inputs.mutate != '') }}
    # The mutation module list lives in stryker.config.json; combined break threshold 80 (CHK-M2-TOOLS-c).
    name: mutation (ubuntu, node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Mutation test
        timeout-minutes: 330
        env:
          MUTATE: ${{ inputs.mutate }}
        run: |
          if [ -n "$MUTATE" ]; then
            pnpm exec stryker run --mutate "$MUTATE"
          else
            pnpm exec stryker run
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
