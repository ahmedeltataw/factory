# CI for the factory repo (card M1-03, CHK-M1-03-a).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Forbidden import scan
        run: node scripts/check-forbidden-imports.mjs

      - name: Manifest check
        run: node scripts/check-manifest.mjs

      - name: Evidence check
        shell: bash
        run: node scripts/check-evidence.mjs .factory/evidence/*/*.json
