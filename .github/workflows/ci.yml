# CI for the factory repo (card M1-03, CHK-M1-03-a).
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so check-scope can diff against origin/main
          fetch-depth: 0

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Scope check (diff against origin/main, PR only)
        if: github.event_name == 'pull_request'
        run: node scripts/check-scope.mjs --base origin/main

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Built CLI smoke test
        shell: bash
        run: |
          state_dir=$(mktemp -d)
          trap 'rm -rf "$state_dir"' EXIT
          status=0
          node lib/factory.mjs status --state-dir "$state_dir" --json 2>"$state_dir/stderr" || status=$?
          test "$status" -eq 1 && test -s "$state_dir/stderr"

      - name: Forbidden import scan
        run: node scripts/check-forbidden-imports.mjs

      - name: Traceability check
        run: node scripts/check-traceability.mjs --all --require-passing

      - name: Manifest check
        run: node scripts/check-manifest.mjs

      - name: Evidence check
        shell: bash
        run: node scripts/check-evidence.mjs .factory/evidence/*/*.json

  mutation:
    # Mutation covers store.ts, commands.ts and supervisor-lease.ts; combined break threshold 80 (CHK-M2-TOOLS-c).
    name: mutation (ubuntu, node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Mutation test (three-file config)
        timeout-minutes: 40
        run: pnpm exec stryker run
